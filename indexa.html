<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Douyin Like Effect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0f1e 0%, #03050b 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            padding: 16px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00f2fe, #ff0040, #ffb347);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradien 2s ease infinite;
        }

        @keyframes gradien {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            background: rgba(10, 20, 30, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .canvas-wrapper {
            text-align: center;
            margin-bottom: 24px;
        }

        canvas {
            width: 100%;
            max-width: 320px;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            background: #000;
            margin: 0 auto;
            display: block;
        }

        .upload-area {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .file-label {
            background: #2a2f3f;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            color: white;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .file-label:hover {
            background: #ff0040;
        }

        #audioName {
            color: #ffb347;
            font-size: 0.75rem;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 14px;
            border-radius: 40px;
        }

        .selector-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 16px 0;
            flex-wrap: wrap;
        }

        .theme-btn, .effect-btn {
            background: rgba(30, 35, 50, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 18px;
            border-radius: 40px;
            cursor: pointer;
            color: white;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .theme-btn:hover, .effect-btn:hover {
            background: rgba(50, 55, 70, 0.9);
        }

        .theme-btn.active, .effect-btn.active {
            background: linear-gradient(95deg, #ff0040, #ff7a00);
            border-color: #ff7a00;
        }

        .text-input-area {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            padding: 16px;
            margin: 16px 0;
        }

        .text-input-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .text-input-group:last-child {
            margin-bottom: 0;
        }

        .text-input-group label {
            color: #ffd966;
            font-size: 0.75rem;
            font-weight: 600;
            min-width: 75px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .text-input-group input {
            flex: 1;
            padding: 8px 14px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            font-size: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .text-input-group input:focus {
            outline: none;
            border-color: #ff0040;
        }

        .res-selector {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 16px 0;
            flex-wrap: wrap;
        }

        .res-btn {
            background: rgba(30, 35, 50, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 18px;
            border-radius: 40px;
            cursor: pointer;
            text-align: center;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .res-btn.active {
            background: #ff0040;
        }

        .res-name {
            font-size: 0.75rem;
            color: white;
            font-weight: bold;
        }

        .slider-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin: 16px 0;
            flex-wrap: wrap;
        }

        .slider-group span {
            color: #ffd966;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        input[type="range"] {
            width: 160px;
            height: 3px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #ff0040, #00f2fe);
            border-radius: 10px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: white;
            border-radius: 50%;
            border: 1px solid #ff3b6f;
            cursor: pointer;
        }

        .fps-group {
            display: flex;
            gap: 15px;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 18px;
            border-radius: 40px;
        }

        .fps-group label {
            color: white;
            font-size: 0.75rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .fps-group input {
            margin-right: 3px;
        }

        .controls {
            display: flex;
            justify-content: center;
            margin: 20px 0 16px;
        }

        button {
            padding: 12px 28px;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            background: linear-gradient(95deg, #ff0040, #ff7a00);
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        button.rendering {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

        .progress-container {
            display: none;
            margin-top: 16px;
        }

        .progress-bar-bg {
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff0040, #ffb347);
            width: 0%;
            border-radius: 5px;
        }

        .progress-text {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 8px;
            color: #ffaa66;
        }

        .duration-info {
            font-size: 0.7rem;
            text-align: center;
            color: #aaa;
            margin-top: 5px;
        }

        .status {
            text-align: center;
            margin-top: 16px;
            padding: 10px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.5);
            color: #ddd;
            font-size: 0.75rem;
        }

        .status.loading {
            background: rgba(0, 100, 200, 0.3);
            color: #88ccff;
        }

        .status.rendering {
            background: rgba(255, 100, 0, 0.3);
            color: #ffaa66;
        }

        .status.success {
            background: rgba(0, 200, 100, 0.3);
            color: #88ffaa;
        }

        .status.error {
            background: rgba(200, 0, 0, 0.3);
            color: #ff8888;
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .card { padding: 16px; }
            .text-input-group { flex-direction: column; align-items: stretch; }
            .text-input-group label { min-width: auto; }
            .selector-group { gap: 8px; }
            .theme-btn, .effect-btn { padding: 6px 14px; font-size: 0.7rem; }
            .res-btn { padding: 6px 14px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="title"><i class="fa fa-bolt"></i> DOUYIN LIKE <i class="fa fa-bolt"></i></div>
    </div>

    <div class="card">
        <div class="canvas-wrapper">
            <canvas id="douyinCanvas" width="540" height="960" style="width:100%; max-width:320px; height:auto; border-radius:20px"></canvas>
        </div>

        <div class="upload-area">
            <label class="file-label" for="audioFileInput">
                <i class="fa fa-music"></i> Upload MP3
            </label>
            <input type="file" id="audioFileInput" accept="audio/mpeg,audio/mp3" style="display:none">
            <span id="audioName"><i class="fa fa-headphones"></i> Belum ada</span>
        </div>

        <div class="selector-group">
            <div class="theme-btn active" data-theme="colorful"><i class="fa fa-paint-brush"></i> Colorful</div>
            <div class="theme-btn" data-theme="dark"><i class="fa fa-moon-o"></i> Dark Glow</div>
        </div>

        <div class="selector-group">
            <div class="effect-btn active" data-effect="default"><i class="fa fa-circle-o"></i> Default</div>
            <div class="effect-btn" data-effect="neon"><i class="fa fa-bolt"></i> Neon</div>
            <div class="effect-btn" data-effect="fire"><i class="fa fa-fire"></i> Fire</div>
            <div class="effect-btn" data-effect="ice"><i class="fa fa-snowflake-o"></i> Ice</div>
        </div>

        <div class="text-input-area">
            <div class="text-input-group">
                <label><i class="fa fa-text-height"></i> Teks Atas</label>
                <input type="text" id="mainTextInput" value="⚡ VIRAL ⚡" maxlength="30">
            </div>
            <div class="text-input-group">
                <label><i class="fa fa-circle-o"></i> Teks Tengah</label>
                <input type="text" id="centerTextInput" value="DOUYIN LIKE" maxlength="20">
            </div>
            <div class="text-input-group">
                <label><i class="fa fa-hashtag"></i> Teks Bawah</label>
                <input type="text" id="subTextInput" value="#DouyinLike" maxlength="35">
            </div>
        </div>

        <div class="res-selector">
            <div class="res-btn" data-res="youtube"><i class="fa fa-youtube-play"></i><div class="res-name">YouTube</div></div>
            <div class="res-btn active" data-res="tiktok"><i class="fa fa-music"></i><div class="res-name">TikTok</div></div>
            <div class="res-btn" data-res="instagram"><i class="fa fa-instagram"></i><div class="res-name">Instagram</div></div>
        </div>

        <div class="slider-group">
            <div class="fps-group">
                <span><i class="fa fa-video-camera"></i></span>
                <label><input type="radio" name="fps" value="24" checked> 24 FPS</label>
                <label><input type="radio" name="fps" value="30"> 30 FPS</label>
            </div>
            <span><i class="fa fa-flash"></i> <span id="intensityVal">12</span></span>
            <input type="range" id="intensitySlider" min="0" max="20" value="12">
        </div>

        <div class="controls">
            <button id="saveBtn" disabled><i class="fa fa-download"></i> RENDER VIDEO</button>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
            <div class="progress-text" id="progressText"></div>
            <div class="duration-info" id="durationInfo"></div>
        </div>

        <div id="status" class="status"><i class="fa fa-info-circle"></i> Upload MP3 (max 10 menit)</div>
    </div>
</div>

<script>
    (function() {
        const MAX_DURATION_SECONDS = 600;
        
        const resolutions = {
            youtube: { width: 1920, height: 1080, name: "YouTube" },
            instagram: { width: 1080, height: 1080, name: "Instagram" },
            tiktok: { width: 1080, height: 1920, name: "TikTok" }
        };
        
        let currentRes = "tiktok";
        let canvasWidth = 1080;
        let canvasHeight = 1920;
        
        const canvas = document.getElementById('douyinCanvas');
        const ctx = canvas.getContext('2d');
        
        let currentTheme = "colorful";
        let currentEffect = "default";
        
        let customMainText = "⚡ VIRAL ⚡";
        let customCenterText = "DOUYIN LIKE";
        let customSubText = "#DouyinLike";
        
        document.getElementById('mainTextInput').addEventListener('input', (e) => customMainText = e.target.value || "⚡ VIRAL ⚡");
        document.getElementById('centerTextInput').addEventListener('input', (e) => customCenterText = e.target.value || "DOUYIN LIKE");
        document.getElementById('subTextInput').addEventListener('input', (e) => customSubText = e.target.value || "#DouyinLike");
        
        function setTheme(theme) {
            currentTheme = theme;
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.theme === theme) btn.classList.add('active');
            });
        }
        
        function setEffect(effect) {
            currentEffect = effect;
            document.querySelectorAll('.effect-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.effect === effect) btn.classList.add('active');
            });
        }
        
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => setTheme(btn.dataset.theme));
        });
        
        document.querySelectorAll('.effect-btn').forEach(btn => {
            btn.addEventListener('click', () => setEffect(btn.dataset.effect));
        });
        
        let audioFileData = null;
        let audioDuration = 0;
        let isRendering = false;
        let audioContext = null;
        let analyserNode = null;
        let sourceNode = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let canvasStream = null;
        let recordingTimeout = null;
        let renderAnimationId = null;
        
        let effectIntensity = 12;
        let selectedFps = 24;
        
        document.querySelectorAll('input[name="fps"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.checked) selectedFps = parseInt(e.target.value);
            });
        });
        
        document.getElementById('intensitySlider').addEventListener('input', (e) => {
            effectIntensity = parseInt(e.target.value);
            document.getElementById('intensityVal').innerText = effectIntensity;
        });
        
        const audioFileInput = document.getElementById('audioFileInput');
        const saveBtn = document.getElementById('saveBtn');
        const statusDiv = document.getElementById('status');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const durationInfo = document.getElementById('durationInfo');
        
        let time = 0;
        let renderStartTime = 0;
        let frameCount = 0;
        let currentEnergy = 0.3;
        let currentBass = 0;
        let spectrumData = new Array(24).fill(0);
        
        function setResolution(resKey) {
            currentRes = resKey;
            const res = resolutions[resKey];
            canvasWidth = res.width;
            canvasHeight = res.height;
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
            
            document.querySelectorAll('.res-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.res === resKey) btn.classList.add('active');
            });
        }
        
        document.querySelectorAll('.res-btn').forEach(btn => {
            btn.addEventListener('click', () => setResolution(btn.dataset.res));
        });
        setResolution('tiktok');
        
        audioFileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            statusDiv.innerHTML = `<i class="fa fa-spinner fa-spin"></i> Loading MP3...`;
            statusDiv.className = "status loading";
            
            try {
                const arrayBuffer = await file.arrayBuffer();
                audioFileData = arrayBuffer;
                
                const tempContext = new (window.AudioContext || window.webkitAudioContext)();
                const audioBuffer = await tempContext.decodeAudioData(arrayBuffer.slice(0));
                audioDuration = audioBuffer.duration;
                await tempContext.close();
                
                const minutes = Math.floor(audioDuration / 60);
                const seconds = Math.floor(audioDuration % 60);
                durationInfo.innerHTML = `<i class="fa fa-hourglass-half"></i> Durasi: ${minutes}:${seconds.toString().padStart(2, '0')}`;
                
                if (audioDuration > MAX_DURATION_SECONDS) {
                    statusDiv.innerHTML = `<i class="fa fa-exclamation-triangle"></i> Maksimal 10 menit!`;
                    statusDiv.className = "status error";
                    saveBtn.disabled = true;
                    return;
                }
                
                statusDiv.innerHTML = `<i class="fa fa-check-circle"></i> MP3 siap! Klik RENDER`;
                statusDiv.className = "status";
                saveBtn.disabled = false;
            } catch (err) {
                statusDiv.innerHTML = `<i class="fa fa-exclamation-triangle"></i> Gagal: ${err.message}`;
                statusDiv.className = "status error";
                saveBtn.disabled = true;
            }
        });
        
        async function createNewAudioForRender() {
            if (!audioFileData) throw new Error("No audio data");
            if (audioContext) await audioContext.close();
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyserNode = audioContext.createAnalyser();
            analyserNode.fftSize = 256;
            const blob = new Blob([audioFileData], { type: 'audio/mpeg' });
            const url = URL.createObjectURL(blob);
            const newAudio = new Audio(url);
            newAudio.crossOrigin = "anonymous";
            newAudio.loop = false;
            newAudio.volume = 1;
            sourceNode = audioContext.createMediaElementSource(newAudio);
            sourceNode.connect(analyserNode);
            analyserNode.connect(audioContext.destination);
            if (audioContext.state === 'suspended') await audioContext.resume();
            return newAudio;
        }
        
        function updateEnergy() {
            if (!analyserNode || !currentAudioElement || currentAudioElement.paused) {
                currentEnergy = 0.4 + Math.sin(time * 2) * 0.15;
                currentBass = 0.3 + Math.sin(time * 3) * 0.12;
                for (let i = 0; i < spectrumData.length; i++) {
                    spectrumData[i] = 0.3 + Math.sin(time * 3 + i * 0.25) * 0.2;
                }
                return;
            }
            const data = new Uint8Array(analyserNode.frequencyBinCount);
            analyserNode.getByteFrequencyData(data);
            let bass = 0;
            for (let i = 0; i < Math.min(10, data.length); i++) bass += data[i];
            currentBass = Math.min(0.9, (bass / (10 * 255)) * 1.2);
            let total = 0;
            for (let i = 0; i < data.length; i++) total += data[i];
            currentEnergy = Math.min(0.9, (total / (data.length * 255)) * 1.3);
            const step = Math.floor(data.length / spectrumData.length);
            for (let i = 0; i < spectrumData.length; i++) {
                let sum = 0, cnt = 0;
                for (let j = 0; j < step && i * step + j < data.length; j++) {
                    sum += data[i * step + j];
                    cnt++;
                }
                spectrumData[i] = Math.min(0.9, (sum / (cnt * 255)) * 1.2);
            }
        }
        
        function getEffectHue(energy, progress) {
            const t = time;
            switch (currentEffect) {
                case 'neon': return (t * 80 + energy * 200) % 360;
                case 'fire': return (20 + energy * 40);
                case 'ice': return (180 + energy * 60);
                default: return (t * 40 + energy * 200 + progress * 100) % 360;
            }
        }
        
        function drawCircleSpectrum(centerX, centerY, radius, energy, bass, spectrum) {
            const intensity = effectIntensity / 12;
            const isDark = currentTheme === "dark";
            const hue = getEffectHue(energy, 0);
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            
            if (isDark) {
                const grad = ctx.createRadialGradient(centerX, centerY, 5, centerX, centerY, radius);
                grad.addColorStop(0, `rgba(80, 80, 80, 0.4)`);
                grad.addColorStop(1, `rgba(30, 30, 30, 0.2)`);
                ctx.fillStyle = grad;
            } else {
                const grad = ctx.createRadialGradient(centerX, centerY, 5, centerX, centerY, radius);
                grad.addColorStop(0, `hsla(${hue}, 75%, 55%, 0.4)`);
                grad.addColorStop(1, `hsla(${hue + 60}, 75%, 45%, 0.2)`);
                ctx.fillStyle = grad;
            }
            ctx.fill();
            
            ctx.strokeStyle = isDark ? `rgba(255, 255, 255, 0.4)` : `rgba(255, 255, 255, 0.5)`;
            ctx.lineWidth = 2 + bass * 3;
            ctx.stroke();
            
            const barCount = Math.min(spectrum.length, 24);
            const angleStep = (Math.PI * 2) / barCount;
            
            for (let i = 0; i < barCount; i++) {
                const barHeight = 6 + (spectrum[i] * 35 * intensity);
                const angle = i * angleStep - Math.PI / 2;
                const x1 = centerX + (radius - 5) * Math.cos(angle);
                const y1 = centerY + (radius - 5) * Math.sin(angle);
                const x2 = centerX + (radius + barHeight) * Math.cos(angle);
                const y2 = centerY + (radius + barHeight) * Math.sin(angle);
                
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.lineWidth = 4;
                
                if (isDark) {
                    const bright = 100 + 155 * spectrum[i];
                    ctx.strokeStyle = `rgb(${bright}, ${bright}, ${bright})`;
                } else {
                    ctx.strokeStyle = `hsl(${hue + i * 15}, 80%, 65%)`;
                }
                ctx.stroke();
            }
            
            const innerRadius = radius * 0.55;
            ctx.beginPath();
            ctx.arc(centerX, centerY, innerRadius, 0, Math.PI * 2);
            ctx.fillStyle = isDark ? `rgba(0, 0, 0, 0.7)` : `rgba(0, 0, 0, 0.55)`;
            ctx.fill();
            ctx.strokeStyle = isDark ? `rgba(255, 255, 255, 0.4)` : `rgba(255, 255, 255, 0.4)`;
            ctx.lineWidth = 1.5;
            ctx.stroke();
            
            ctx.font = `bold ${Math.min(32, 24 + bass * 10)}px "Segoe UI", "Poppins"`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = `white`;
            ctx.fillText(customCenterText, centerX, centerY);
        }
        
        function drawFullEffect(progress) {
            const w = canvasWidth, h = canvasHeight;
            const t = time;
            const intensity = effectIntensity / 12;
            const react = currentEnergy * intensity * 1.2;
            const isDark = currentTheme === "dark";
            const hue = getEffectHue(currentEnergy, progress);
            
            const shakeX = Math.sin(t * 35) * (react * 1.2);
            const shakeY = Math.cos(t * 32) * (react * 1);
            
            ctx.save();
            ctx.clearRect(0, 0, w, h);
            ctx.translate(shakeX, shakeY);
            
            if (isDark) {
                const grad = ctx.createLinearGradient(0, 0, w, h);
                grad.addColorStop(0, `#0a0a0a`);
                grad.addColorStop(1, `#050505`);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);
            } else {
                const grad = ctx.createLinearGradient(0, 0, w, 0);
                if (currentEffect === "fire") {
                    grad.addColorStop(0, `#ff4d00`);
                    grad.addColorStop(1, `#8b0000`);
                } else if (currentEffect === "ice") {
                    grad.addColorStop(0, `#00bfff`);
                    grad.addColorStop(1, `#000080`);
                } else {
                    grad.addColorStop(0, `hsl(${hue}, 75%, 50%)`);
                    grad.addColorStop(1, `hsl(${hue + 80}, 75%, 35%)`);
                }
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);
            }
            
            const eqCount = 20;
            for (let i = 0; i < eqCount; i++) {
                const barH = 3 + Math.sin(t * 12 + i) * 4 + currentEnergy * 18;
                const x = i * (w / eqCount) + t * 15 % (w / eqCount);
                ctx.fillStyle = isDark ? `rgba(255, 255, 255, 0.12)` : `hsla(${hue + i * 15}, 75%, 60%, 0.4)`;
                ctx.fillRect(x, h / 2 - barH / 2, Math.max(4, w / eqCount - 2), barH);
            }
            
            const centerX = w / 2;
            const centerY = h / 2;
            const circleRadius = Math.min(w, h) * 0.28;
            drawCircleSpectrum(centerX, centerY, circleRadius, currentEnergy, currentBass, spectrumData);
            
            const fontSize = Math.min(42, 32 + currentEnergy * 14);
            ctx.font = `bold ${fontSize}px "Segoe UI", "Poppins"`;
            ctx.textAlign = "center";
            const textX = w / 2 + Math.sin(t * 22) * (react * 0.6);
            const textY = h * 0.12 + Math.cos(t * 19) * (react * 0.4);
            const offset = intensity * 0.2 + currentEnergy * 8;
            
            if (isDark) {
                ctx.fillStyle = `white`;
                ctx.fillText(customMainText, textX, textY);
            } else {
                ctx.fillStyle = `rgba(255, 40, 80, 0.9)`;
                ctx.fillText(customMainText, textX - offset, textY);
                ctx.fillStyle = `rgba(0, 230, 250, 0.9)`;
                ctx.fillText(customMainText, textX + offset, textY);
                ctx.fillStyle = `white`;
                ctx.fillText(customMainText, textX, textY);
            }
            
            const subFontSize = Math.min(20, 14 + currentEnergy * 6);
            ctx.font = `bold ${subFontSize}px "Segoe UI", "Poppins"`;
            ctx.fillStyle = isDark ? `#cccccc` : `hsl(${hue + 80}, 80%, 65%)`;
            ctx.fillText(customSubText, textX + Math.sin(t * 12) * 2, textY + fontSize * 0.7);
            
            const particleCnt = 8 + Math.floor(currentEnergy * 12);
            for (let p = 0; p < particleCnt; p++) {
                const angle = t * 3 + p;
                const rad = circleRadius + 25 + currentBass * 30;
                const xOff = Math.sin(angle) * rad;
                const yOff = Math.cos(angle * 1.3) * rad * 0.7;
                ctx.fillStyle = isDark ? `rgba(255, 255, 255, 0.4)` : `hsla(${hue + p * 20}, 80%, 65%, 0.5)`;
                ctx.fillText("✦", w / 2 + xOff, h / 2 + yOff);
            }
            ctx.restore();
            
            ctx.globalCompositeOperation = 'lighter';
            ctx.fillStyle = isDark ? `rgba(255, 255, 255, 0.03)` : `rgba(255, 60, 120, 0.08)`;
            ctx.fillRect(0, 0, w, h);
            ctx.globalCompositeOperation = 'source-over';
        }
        
        let currentAudioElement = null;
        
        function startRenderLoop(durationMs) {
            renderStartTime = performance.now();
            frameCount = 0;
            
            function renderFrame(now) {
                if (!isRendering) return;
                const elapsed = now - renderStartTime;
                const progress = Math.min(1, elapsed / durationMs);
                updateEnergy();
                drawFullEffect(progress);
                time += 0.02;
                frameCount++;
                
                const percent = progress * 100;
                progressFill.style.width = `${percent}%`;
                const currentSec = Math.floor(progress * audioDuration);
                progressText.innerHTML = `${Math.floor(percent)}% (${currentSec}/${Math.floor(audioDuration)} detik)`;
                
                if (progress < 1 && isRendering) {
                    renderAnimationId = requestAnimationFrame(renderFrame);
                } else if (progress >= 1 && isRendering) {
                    finishRendering();
                }
            }
            renderAnimationId = requestAnimationFrame(renderFrame);
        }
        
        async function startRender() {
            if (!audioFileData || !audioDuration) {
                statusDiv.innerHTML = `<i class="fa fa-exclamation-triangle"></i> Upload MP3 dulu!`;
                statusDiv.className = "status error";
                return;
            }
            if (isRendering) return;
            
            isRendering = true;
            saveBtn.disabled = true;
            saveBtn.classList.add('rendering');
            progressContainer.style.display = "block";
            progressFill.style.width = "0%";
            statusDiv.innerHTML = `<i class="fa fa-spinner fa-spin"></i> Rendering video...`;
            statusDiv.className = "status rendering";
            time = 0;
            frameCount = 0;
            
            try {
                const newAudio = await createNewAudioForRender();
                currentAudioElement = newAudio;
                newAudio.volume = 1;
                newAudio.currentTime = 0;
                
                canvasStream = canvas.captureStream(selectedFps);
                
                let audioStream = null;
                if (audioContext && sourceNode) {
                    const dest = audioContext.createMediaStreamDestination();
                    sourceNode.connect(dest);
                    audioStream = dest.stream;
                }
                
                let tracks = [...canvasStream.getVideoTracks()];
                if (audioStream) tracks = tracks.concat(audioStream.getAudioTracks());
                const combined = new MediaStream(tracks);
                
                mediaRecorder = new MediaRecorder(combined, {
                    mimeType: 'video/webm',
                    videoBitsPerSecond: 3000000
                });
                recordedChunks = [];
                
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };
                
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    const songName = audioFileInput.files[0]?.name.replace('.mp3', '') || 'douyin';
                    a.download = `${songName}_douyin_effect.webm`;
                    a.href = url;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    
                    statusDiv.innerHTML = `<i class="fa fa-check-circle"></i> Selesai! Video WebM siap.`;
                    statusDiv.className = "status success";
                    progressContainer.style.display = "none";
                    saveBtn.disabled = false;
                    saveBtn.classList.remove('rendering');
                    isRendering = false;
                    if (canvasStream) canvasStream.getTracks().forEach(t => t.stop());
                };
                
                mediaRecorder.start(100);
                await newAudio.play();
                
                const durationMs = audioDuration * 1000;
                startRenderLoop(durationMs);
                
                recordingTimeout = setTimeout(() => {
                    if (isRendering && mediaRecorder && mediaRecorder.state === 'recording') {
                        mediaRecorder.stop();
                        if (renderAnimationId) cancelAnimationFrame(renderAnimationId);
                    }
                }, durationMs + 500);
            } catch (err) {
                statusDiv.innerHTML = `<i class="fa fa-exclamation-triangle"></i> Error: ${err.message}`;
                statusDiv.className = "status error";
                cancelRender();
            }
        }
        
        function finishRendering() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                if (renderAnimationId) cancelAnimationFrame(renderAnimationId);
                if (recordingTimeout) clearTimeout(recordingTimeout);
            }
        }
        
        function cancelRender() {
            if (isRendering) {
                if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
                if (renderAnimationId) cancelAnimationFrame(renderAnimationId);
                if (recordingTimeout) clearTimeout(recordingTimeout);
                isRendering = false;
                saveBtn.disabled = false;
                saveBtn.classList.remove('rendering');
                progressContainer.style.display = "none";
                if (currentAudioElement) currentAudioElement.pause();
                if (audioContext) audioContext.close();
            }
        }
        
        saveBtn.onclick = startRender;
        
        canvas.addEventListener('click', () => {
            if (!isRendering && navigator.vibrate) navigator.vibrate(50);
        });
        
        function idle() {
            if (!isRendering) {
                updateEnergy();
                drawFullEffect(0);
                time += 0.03;
            }
            requestAnimationFrame(idle);
        }
        idle();
    })();
</script>
