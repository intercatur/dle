<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Douyin Like Effect - Lightweight</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0f1e 0%, #03050b 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            padding: 15px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 15px; }
        .title {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00f2fe, #ff0040, #ffb347);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .card {
            background: rgba(10, 20, 30, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .canvas-wrapper { text-align: center; }
        canvas {
            width: 100%;
            max-width: 320px;
            border-radius: 16px;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.1);
            cursor: pointer;
            background: #000;
            margin: 0 auto;
            display: block;
        }
        .upload-area { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
        .file-label {
            background: #2a2f3f;
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            color: white;
            font-size: 0.8rem;
            font-weight: 600;
        }
        #audioName { color: #ffb347; font-size: 0.7rem; background: rgba(0,0,0,0.5); padding: 5px 12px; border-radius: 40px; }
        
        .theme-selector, .effect-selector { display: flex; gap: 8px; justify-content: center; margin: 10px 0; flex-wrap: wrap; }
        .theme-btn, .effect-btn {
            background: rgba(30,35,50,0.8);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 5px 12px;
            border-radius: 40px;
            cursor: pointer;
            color: white;
            font-size: 0.7rem;
            font-weight: 500;
        }
        .theme-btn.active, .effect-btn.active {
            background: linear-gradient(95deg, #ff0040, #ff7a00);
            border-color: #ff7a00;
        }
        
        /* Mode Hemat Toggle */
        .eco-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 10px 0;
            background: rgba(0,0,0,0.4);
            padding: 6px;
            border-radius: 40px;
        }
        .eco-toggle label {
            color: white;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .eco-toggle input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .text-input-area {
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            padding: 10px;
            margin: 10px 0;
        }
        .text-input-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .text-input-group label {
            color: #ffd966;
            font-size: 0.7rem;
            min-width: 65px;
        }
        .text-input-group input {
            flex: 1;
            padding: 6px 12px;
            border-radius: 40px;
            background: rgba(0,0,0,0.5);
            color: white;
            font-size: 0.75rem;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .res-selector { display: flex; gap: 8px; justify-content: center; margin: 10px 0; flex-wrap: wrap; }
        .res-btn {
            background: rgba(30,35,50,0.8);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 40px;
            cursor: pointer;
            text-align: center;
        }
        .res-btn.active { background: #ff0040; }
        .res-name { font-size: 0.7rem; color: white; font-weight: bold; }
        
        .controls { display: flex; justify-content: center; margin: 15px 0; }
        button {
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            background: linear-gradient(95deg, #ff0040, #ff7a00);
            color: white;
        }
        .status {
            text-align: center;
            margin-top: 10px;
            padding: 8px;
            border-radius: 40px;
            background: rgba(0,0,0,0.5);
            color: #ddd;
            font-size: 0.7rem;
        }
        .slider-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 8px 0;
        }
        .slider-group span { color: #ffd966; font-size: 0.7rem; }
        input[type="range"] { width: 150px; height: 3px; }
        .fps-group {
            display: flex;
            gap: 12px;
            background: rgba(0,0,0,0.3);
            padding: 4px 12px;
            border-radius: 40px;
        }
        .fps-group label { color: white; font-size: 0.7rem; }
        .progress-container { display: none; margin-top: 10px; }
        .progress-bar-bg { height: 4px; background: rgba(255,255,255,0.2); border-radius: 5px; }
        .progress-bar-fill { height: 100%; background: #ff0040; width: 0%; }
        .progress-text { font-size: 0.65rem; text-align: center; margin-top: 4px; color: #ffaa66; }
        .duration-info { font-size: 0.65rem; text-align: center; color: #aaa; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="title"><i class="fa fa-bolt"></i> DOUYIN LIKE <i class="fa fa-bolt"></i></div>
    </div>

    <div class="card">
        <div class="canvas-wrapper">
            <canvas id="douyinCanvas" width="540" height="960" style="width:100%; max-width:320px; height:auto; border-radius:16px"></canvas>
        </div>

        <div class="upload-area">
            <label class="file-label"><i class="fa fa-music"></i> MP3</label>
            <input type="file" id="audioFile" accept="audio/mpeg,audio/mp3" style="display:none">
            <span id="audioName"><i class="fa fa-headphones"></i> Upload</span>
        </div>

        <div class="eco-toggle">
            <input type="checkbox" id="ecoModeCheckbox">
            <label for="ecoModeCheckbox"><i class="fa fa-leaf"></i> Mode Hemat (Performa)</label>
        </div>

        <div class="theme-selector">
            <div class="theme-btn active" data-theme="colorful">Color</div>
            <div class="theme-btn" data-theme="dark">Dark</div>
        </div>

        <div class="effect-selector">
            <div class="effect-btn active" data-effect="default">Default</div>
            <div class="effect-btn" data-effect="neon">Neon</div>
            <div class="effect-btn" data-effect="fire">Fire</div>
            <div class="effect-btn" data-effect="ice">Ice</div>
        </div>

        <div class="text-input-area">
            <div class="text-input-group"><label>Teks Atas</label><input type="text" id="mainTextInput" value="⚡ VIRAL ⚡" maxlength="30"></div>
            <div class="text-input-group"><label>Teks Tengah</label><input type="text" id="centerTextInput" value="DOUYIN" maxlength="15"></div>
            <div class="text-input-group"><label>Teks Bawah</label><input type="text" id="subTextInput" value="#FYP" maxlength="30"></div>
        </div>

        <div class="res-selector">
            <div class="res-btn" data-res="youtube"><div class="res-name">YT</div></div>
            <div class="res-btn active" data-res="tiktok"><div class="res-name">TT</div></div>
            <div class="res-btn" data-res="instagram"><div class="res-name">IG</div></div>
        </div>

        <div class="slider-group">
            <div class="fps-group"><span>FPS</span><label><input type="radio" name="fps" value="24">24</label><label><input type="radio" name="fps" value="30" checked>30</label></div>
            <span><i class="fa fa-flash"></i> <span id="intensityVal">15</span></span>
            <input type="range" id="intensitySlider" min="0" max="30" value="15">
        </div>

        <div class="controls">
            <button id="saveBtn" disabled><i class="fa fa-floppy-o"></i> RENDER</button>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
            <div class="progress-text" id="progressText"></div>
            <div class="duration-info" id="durationInfo"></div>
        </div>
        <div id="status" class="status"><i class="fa fa-info-circle"></i> Upload MP3 (max 10 menit)</div>
    </div>
</div>

<script>
    (function(){
        const MAX_DURATION_SECONDS = 600;
        let isEco = false;
        const ecoCheck = document.getElementById('ecoModeCheckbox');
        ecoCheck.addEventListener('change', (e) => { isEco = e.target.checked; });

        const resolutions = {
            youtube: { width: 1920, height: 1080, name: "YT" },
            instagram: { width: 1080, height: 1080, name: "IG" },
            tiktok: { width: 1080, height: 1920, name: "TT" }
        };
        let currentRes = "tiktok";
        let canvasWidth = 1080, canvasHeight = 1920;
        const canvas = document.getElementById('douyinCanvas');
        const ctx = canvas.getContext('2d');
        
        let currentTheme = "colorful";
        let currentEffect = "default";
        let customMainText = "⚡ VIRAL ⚡";
        let customCenterText = "DOUYIN";
        let customSubText = "#FYP";
        
        document.getElementById('mainTextInput').addEventListener('input', (e) => customMainText = e.target.value || "⚡ VIRAL ⚡");
        document.getElementById('centerTextInput').addEventListener('input', (e) => customCenterText = e.target.value || "DOUYIN");
        document.getElementById('subTextInput').addEventListener('input', (e) => customSubText = e.target.value || "#FYP");
        
        function setTheme(t) { currentTheme = t; document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.theme === t)); }
        function setEffect(e) { currentEffect = e; document.querySelectorAll('.effect-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.effect === e)); }
        document.querySelectorAll('.theme-btn').forEach(btn => btn.addEventListener('click', () => setTheme(btn.dataset.theme)));
        document.querySelectorAll('.effect-btn').forEach(btn => btn.addEventListener('click', () => setEffect(btn.dataset.effect)));
        
        let audioFileData = null, audioDuration = 0, isRendering = false;
        let audioContext = null, analyserNode = null, sourceNode = null;
        let mediaRecorder = null, recordedChunks = [], canvasStream = null, recordingTimeout = null, renderAnimationId = null;
        let effectIntensity = 15, selectedFps = 30;
        document.querySelectorAll('input[name="fps"]').forEach(r => r.addEventListener('change', (e) => { if(e.target.checked) selectedFps = parseInt(e.target.value); }));
        document.getElementById('intensitySlider').addEventListener('input', (e) => { effectIntensity = parseInt(e.target.value); document.getElementById('intensityVal').innerText = effectIntensity; });
        
        const audioFileInput = document.getElementById('audioFile');
        const saveBtn = document.getElementById('saveBtn');
        const statusDiv = document.getElementById('status');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const durationInfo = document.getElementById('durationInfo');
        
        let time = 0, renderStartTime = 0, frameCount = 0;
        let currentEnergy = 0.3, currentBass = 0;
        let spectrumData = new Array(24).fill(0);
        
        function setResolution(resKey) {
            currentRes = resKey;
            const res = resolutions[resKey];
            canvasWidth = res.width;
            canvasHeight = res.height;
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
            document.querySelectorAll('.res-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.res === resKey));
        }
        document.querySelectorAll('.res-btn').forEach(btn => btn.addEventListener('click', () => setResolution(btn.dataset.res)));
        setResolution('tiktok');
        
        audioFileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if(!file) return;
            statusDiv.innerHTML = `<i class="fa fa-spinner fa-spin"></i> Loading...`;
            statusDiv.className = "status loading";
            try {
                const arrayBuffer = await file.arrayBuffer();
                audioFileData = arrayBuffer;
                const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
                const buf = await tempCtx.decodeAudioData(arrayBuffer.slice(0));
                audioDuration = buf.duration;
                await tempCtx.close();
                const mins = Math.floor(audioDuration/60), secs = Math.floor(audioDuration%60);
                durationInfo.innerHTML = `Durasi: ${mins}:${secs.toString().padStart(2,'0')}`;
                if(audioDuration > MAX_DURATION_SECONDS) throw new Error("Max 10 menit");
                statusDiv.innerHTML = `<i class="fa fa-check-circle"></i> Siap! Klik RENDER`;
                statusDiv.className = "status";
                saveBtn.disabled = false;
            } catch(err) {
                statusDiv.innerHTML = `<i class="fa fa-exclamation-triangle"></i> Error: ${err.message}`;
                statusDiv.className = "status error";
                saveBtn.disabled = true;
            }
        });
        
        async function createNewAudioForRender() {
            if(!audioFileData) throw new Error("No audio");
            if(audioContext) await audioContext.close();
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyserNode = audioContext.createAnalyser();
            analyserNode.fftSize = 256;
            const blob = new Blob([audioFileData], {type: 'audio/mpeg'});
            const url = URL.createObjectURL(blob);
            const newAudio = new Audio(url);
            newAudio.crossOrigin = "anonymous";
            newAudio.loop = false;
            newAudio.volume = 1;
            sourceNode = audioContext.createMediaElementSource(newAudio);
            sourceNode.connect(analyserNode);
            analyserNode.connect(audioContext.destination);
            if(audioContext.state === 'suspended') await audioContext.resume();
            return newAudio;
        }
        
        function updateEnergy() {
            if(!analyserNode || !currentAudioElement || currentAudioElement.paused) {
                currentEnergy = 0.4 + Math.sin(time*2)*0.15;
                currentBass = 0.3 + Math.sin(time*3)*0.12;
                for(let i=0;i<spectrumData.length;i++) spectrumData[i] = 0.3 + Math.sin(time*3 + i*0.2)*0.2;
                return;
            }
            const data = new Uint8Array(analyserNode.frequencyBinCount);
            analyserNode.getByteFrequencyData(data);
            let bass=0;
            for(let i=0;i<Math.min(10,data.length);i++) bass+=data[i];
            currentBass = Math.min(0.9, (bass/(10*255))*1.2);
            let total=0;
            for(let i=0;i<data.length;i++) total+=data[i];
            currentEnergy = Math.min(0.9, (total/(data.length*255))*1.3);
            const step = Math.floor(data.length / spectrumData.length);
            for(let i=0;i<spectrumData.length;i++) {
                let sum=0, cnt=0;
                for(let j=0;j<step && i*step+j<data.length;j++) { sum+=data[i*step+j]; cnt++; }
                spectrumData[i] = Math.min(0.9, (sum/(cnt*255))*1.2);
            }
        }
        
        function getEffectHue(energy, progress) {
            switch(currentEffect) {
                case 'neon': return (time*80 + energy*200)%360;
                case 'fire': return 20 + energy*40;
                case 'ice': return 180 + energy*60;
                default: return (time*40 + energy*200 + progress*100)%360;
            }
        }
        
        function drawTriangleSpectrum(centerX, centerY, size) {
            const intensity = effectIntensity/15;
            const isDark = currentTheme === "dark";
            const hue = getEffectHue(currentEnergy, 0);
            const angles = [-Math.PI/2, Math.PI/6, Math.PI*5/6];
            const points = angles.map(a => ({x: centerX + size*Math.cos(a), y: centerY + size*Math.sin(a)}));
            
            // Segitiga luar (tanpa shadow blur jika eco)
            if(!isEco) {
                ctx.shadowBlur = isDark ? 12 : 8;
                ctx.shadowColor = isDark ? `rgba(255,255,255,0.3)` : `rgba(255,70,140,0.4)`;
            }
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            ctx.lineTo(points[1].x, points[1].y);
            ctx.lineTo(points[2].x, points[2].y);
            ctx.closePath();
            if(isDark) ctx.fillStyle = `rgba(50,50,50,0.5)`;
            else ctx.fillStyle = `hsla(${hue}, 70%, 50%, 0.3)`;
            ctx.fill();
            ctx.strokeStyle = isDark ? `rgba(255,255,255,0.4)` : `rgba(255,255,255,0.5)`;
            ctx.lineWidth = 2 + currentBass*2;
            ctx.stroke();
            
            // Batang spektrum (lebih sedikit jika eco)
            let barCount = isEco ? 18 : 30;
            const barsPerSide = Math.floor(barCount/3);
            const sideEnergy = [0,0,0];
            for(let s=0;s<3;s++) {
                let sum=0;
                for(let i=0;i<barsPerSide && s*barsPerSide+i<spectrumData.length;i++) sum+=spectrumData[s*barsPerSide+i];
                sideEnergy[s] = sum/barsPerSide;
            }
            
            function drawBarsOnEdge(p1,p2,startIdx) {
                const dx = p2.x-p1.x, dy = p2.y-p1.y;
                const segLen = Math.hypot(dx,dy);
                const barW = Math.max(3, segLen/barsPerSide * 0.6);
                for(let i=0;i<barsPerSide && startIdx+i<spectrumData.length;i++) {
                    const t = (i+0.5)/barsPerSide;
                    const barH = 4 + (spectrumData[startIdx+i] * (isEco ? 25 : 40) * intensity);
                    const bx = p1.x + dx*t, by = p1.y + dy*t;
                    const perpX = dy/segLen, perpY = -dx/segLen;
                    const ex = bx + perpX*barH, ey = by + perpY*barH;
                    ctx.beginPath();
                    ctx.moveTo(bx,by);
                    ctx.lineTo(ex,ey);
                    ctx.lineWidth = barW;
                    if(isDark) ctx.strokeStyle = `rgb(${100+155*spectrumData[startIdx+i]}, ${100+155*spectrumData[startIdx+i]}, ${100+155*spectrumData[startIdx+i]})`;
                    else ctx.strokeStyle = `hsl(${hue + (startIdx+i)*10}, 75%, 60%)`;
                    ctx.stroke();
                }
            }
            drawBarsOnEdge(points[0],points[1],0);
            drawBarsOnEdge(points[1],points[2],barsPerSide);
            drawBarsOnEdge(points[2],points[0],barsPerSide*2);
            
            // Segitiga dalam
            const inner = size * 0.55;
            const inPts = angles.map(a => ({x: centerX + inner*Math.cos(a), y: centerY + inner*Math.sin(a)}));
            ctx.beginPath();
            ctx.moveTo(inPts[0].x, inPts[0].y);
            ctx.lineTo(inPts[1].x, inPts[1].y);
            ctx.lineTo(inPts[2].x, inPts[2].y);
            ctx.closePath();
            ctx.fillStyle = isDark ? `rgba(0,0,0,0.7)` : `rgba(0,0,0,0.5)`;
            ctx.fill();
            ctx.font = `bold ${Math.min(32, 22 + currentBass*8)}px "Segoe UI"`;
            ctx.fillStyle = "white";
            ctx.shadowBlur = 0;
            ctx.fillText(customCenterText, centerX, centerY);
        }
        
        function drawFullEffect(progress) {
            const w=canvasWidth, h=canvasHeight;
            const t=time;
            const intensity = effectIntensity/12;
            const react = currentEnergy * intensity * 1.2;
            const isDark = currentTheme === "dark";
            const hue = getEffectHue(currentEnergy, progress);
            
            const shakeX = isEco ? 0 : (Math.sin(t*35)*react*1.5 + Math.sin(t*18)*react);
            const shakeY = isEco ? 0 : (Math.cos(t*32)*react*1.2);
            
            ctx.save();
            ctx.clearRect(0,0,w,h);
            ctx.translate(shakeX, shakeY);
            
            // Background sederhana
            if(isDark) {
                ctx.fillStyle = "#050505";
                ctx.fillRect(0,0,w,h);
            } else {
                const grad = ctx.createLinearGradient(0,0,w,0);
                grad.addColorStop(0, `hsl(${hue}, 70%, 45%)`);
                grad.addColorStop(1, `hsl(${hue+80}, 70%, 35%)`);
                ctx.fillStyle = grad;
                ctx.fillRect(0,0,w,h);
            }
            
            // Equalizer simple (kurangi jika eco)
            const eqCount = isEco ? 15 : 25;
            for(let i=0;i<eqCount;i++) {
                const barH = 3 + Math.sin(t*10+i)*4 + currentEnergy*15;
                const x = i*(w/eqCount) + t*15 % (w/eqCount);
                ctx.fillStyle = isDark ? `rgba(255,255,255,0.15)` : `hsla(${hue+i*15}, 75%, 55%, 0.5)`;
                ctx.fillRect(x, h/2 - barH/2, Math.max(4, w/eqCount-2), barH);
            }
            
            const centerX = w/2, centerY = h/2;
            const triSize = Math.min(w,h) * 0.28;
            drawTriangleSpectrum(centerX, centerY, triSize);
            
            // Teks atas (tanpa shadow berlebihan)
            const fontSize = Math.min(40, 30 + currentEnergy*12);
            ctx.font = `bold ${fontSize}px "Segoe UI"`;
            ctx.textAlign = "center";
            const textX = w/2 + Math.sin(t*20)*react*0.5;
            const textY = h*0.12 + Math.cos(t*18)*react*0.4;
            const offset = intensity*0.2 + currentEnergy*6;
            if(isDark) {
                ctx.fillStyle = "white";
                ctx.fillText(customMainText, textX, textY);
            } else {
                ctx.fillStyle = `rgba(255,40,80,0.9)`;
                ctx.fillText(customMainText, textX-offset, textY);
                ctx.fillStyle = `rgba(0,230,250,0.9)`;
                ctx.fillText(customMainText, textX+offset, textY);
                ctx.fillStyle = "white";
                ctx.fillText(customMainText, textX, textY);
            }
            
            // Teks bawah
            ctx.font = `bold ${Math.min(18, 14+currentEnergy*5)}px "Segoe UI"`;
            ctx.fillStyle = isDark ? "#ccc" : `hsl(${hue+80}, 80%, 65%)`;
            ctx.fillText(customSubText, textX + Math.sin(t*12)*2, textY + fontSize*0.65);
            
            // Partikel (kurangi drastis jika eco)
            const particleCnt = isEco ? 6 : (12 + currentEnergy*15);
            for(let p=0;p<particleCnt;p++) {
                const ang = t*3 + p;
                const rad = triSize + 25 + currentBass*30;
                const xp = w/2 + Math.sin(ang)*rad;
                const yp = h/2 + Math.cos(ang*1.2)*rad*0.6;
                ctx.fillStyle = isDark ? `rgba(255,255,255,0.4)` : `hsla(${hue + p*20}, 80%, 65%, 0.6)`;
                ctx.fillText("✦", xp, yp);
            }
            ctx.restore();
            
            // Overlay denyut simple
            ctx.globalCompositeOperation = 'lighter';
            ctx.fillStyle = isDark ? `rgba(255,255,255,0.03)` : `rgba(255,60,120,0.08)`;
            ctx.fillRect(0,0,w,h);
            ctx.globalCompositeOperation = 'source-over';
        }
        
        let currentAudioElement = null;
        function startRenderLoop(durationMs) {
            renderStartTime = performance.now();
            frameCount = 0;
            let frameInterval = isEco ? 1000/24 : 1000/selectedFps;
            let lastFrame = 0;
            function renderFrame(now) {
                if(!isRendering) return;
                const elapsed = now - renderStartTime;
                const progress = Math.min(1, elapsed / durationMs);
                updateEnergy();
                drawFullEffect(progress);
                time += 0.02;
                frameCount++;
                const percent = progress*100;
                progressFill.style.width = `${percent}%`;
                const currentSec = Math.floor(progress * audioDuration);
                progressText.innerHTML = `${Math.floor(percent)}% (${currentSec}/${Math.floor(audioDuration)}s)`;
                if(progress < 1 && isRendering) {
                    requestAnimationFrame(renderFrame);
                } else if(progress >= 1 && isRendering) {
                    finishRendering();
                }
            }
            requestAnimationFrame(renderFrame);
        }
        
        async function startRender() {
            if(!audioFileData || !audioDuration) { statusDiv.innerHTML = "Upload MP3 dulu!"; return; }
            if(isRendering) return;
            isRendering = true;
            saveBtn.disabled = true;
            saveBtn.classList.add('rendering');
            progressContainer.style.display = "block";
            progressFill.style.width = "0%";
            statusDiv.innerHTML = `<i class="fa fa-spinner fa-spin"></i> Rendering...`;
            statusDiv.className = "status rendering";
            time = 0; frameCount = 0;
            try {
                const newAudio = await createNewAudioForRender();
                currentAudioElement = newAudio;
                newAudio.volume = 1;
                newAudio.currentTime = 0;
                canvasStream = canvas.captureStream(isEco ? 24 : selectedFps);
                let audioStream = null;
                if(audioContext && sourceNode) {
                    const dest = audioContext.createMediaStreamDestination();
                    sourceNode.connect(dest);
                    audioStream = dest.stream;
                }
                let tracks = [...canvasStream.getVideoTracks()];
                if(audioStream) tracks = tracks.concat(audioStream.getAudioTracks());
                const combined = new MediaStream(tracks);
                mediaRecorder = new MediaRecorder(combined, {mimeType:'video/webm', videoBitsPerSecond: 3000000});
                recordedChunks = [];
                mediaRecorder.ondataavailable = e => { if(e.data.size>0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, {type:'video/webm'});
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.download = `douyin_${Date.now()}.webm`;
                    a.href = url;
                    a.click();
                    URL.revokeObjectURL(url);
                    statusDiv.innerHTML = `✅ Selesai! File WebM siap.`;
                    statusDiv.className = "status success";
                    progressContainer.style.display = "none";
                    saveBtn.disabled = false;
                    saveBtn.classList.remove('rendering');
                    isRendering = false;
                    canvasStream.getTracks().forEach(t=>t.stop());
                };
                mediaRecorder.start(100);
                await newAudio.play();
                const durationMs = audioDuration * 1000;
                startRenderLoop(durationMs);
                recordingTimeout = setTimeout(() => {
                    if(isRendering && mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
                }, durationMs + 500);
            } catch(err) {
                statusDiv.innerHTML = `❌ Error: ${err.message}`;
                cancelRender();
            }
        }
        function finishRendering() {
            if(mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
            if(renderAnimationId) cancelAnimationFrame(renderAnimationId);
            if(recordingTimeout) clearTimeout(recordingTimeout);
        }
        function cancelRender() {
            if(isRendering) {
                if(mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
                isRendering = false;
                saveBtn.disabled = false;
                progressContainer.style.display = "none";
                if(currentAudioElement) currentAudioElement.pause();
                if(audioContext) audioContext.close();
            }
        }
        saveBtn.onclick = startRender;
        
        // Idle animation ringan
        function idle() {
            if(!isRendering) {
                updateEnergy();
                drawFullEffect(0);
                time += 0.03;
            }
            requestAnimationFrame(idle);
        }
        idle();
    })();
</script>
</body>
</html>
